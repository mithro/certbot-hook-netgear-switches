[project]
name = "certbot-hook-netgear-switches"
version = "0.1.0"
description = "Certbot deploy hook: upload LE certs to Netgear switches"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pexpect>=4.9",
    "cryptography>=42",
    # HTTP cert-upload flows (S3300 multipart, GS728TPP GoAhead XML-API) are
    # delegated to the library -- see _upload_cert_via_library in
    # netgear-updater.py. Requires the release that includes GS728TPP cert
    # upload (SyncSwitch.upload_certificate for gs728tpp).
    "python-netgear-switch-library[http]",
]

[dependency-groups]
dev = ["pytest>=8"]
